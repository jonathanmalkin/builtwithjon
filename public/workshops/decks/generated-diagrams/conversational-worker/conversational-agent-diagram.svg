<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Conversational Agent concept diagram</title>
  <desc id="desc">Person on the left, Model in the center, and Tools on the right. Person asks the Model, the Model answers the Person, the Model picks a tool, and Tools react to the result back to the Model.</desc>
  <defs>
    <filter id="soft-shadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1f1713" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #fffdf8; }
      .node {
        filter: url(#soft-shadow);
        stroke-width: 2.5;
      }
      .node-label {
        fill: #1f1713;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .edge {
        fill: none;
        stroke: #1f1713;
        stroke-width: 5;
        stroke-linecap: round;
      }
      .loop {
        fill: none;
        stroke: #8f4e24;
        stroke-width: 6;
        stroke-linecap: round;
      }
      .edge-label {
        fill: #1f1713;
        font-family: "SF Mono", ui-monospace, "Fira Code", Menlo, Consolas, monospace;
        font-size: 38px;
        font-weight: 650;
        letter-spacing: 0;
      }
      .arrow-ink { fill: #1f1713; }
      .arrow-copper { fill: #8f4e24; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1280" height="720"/>

  <g aria-label="Conversation between person and model">
    <line class="edge" x1="362" y1="334" x2="468" y2="334"/>
    <polygon class="arrow-ink" points="486,334 468,324 468,344"/>
    <line class="edge" x1="483" y1="430" x2="377" y2="430"/>
    <polygon class="arrow-ink" points="359,430 377,420 377,440"/>
    <text class="edge-label" x="422.5" y="260" text-anchor="middle" dominant-baseline="middle">Ask</text>
    <text class="edge-label" x="422.5" y="510" text-anchor="middle" dominant-baseline="middle">Answers</text>
  </g>

  <g aria-label="Model tool loop">
    <path class="loop" d="M 790 314 C 806 168 914 168 930 314"/>
    <polygon class="arrow-copper" points="0,0 -18,-10 -18,10" transform="translate(930 314) rotate(84)"/>
    <path class="loop" d="M 930 424 C 912 586 808 586 790 424"/>
    <polygon class="arrow-copper" points="0,0 -18,-10 -18,10" transform="translate(790 424) rotate(-96)"/>
    <text class="edge-label" x="860" y="126" text-anchor="middle" dominant-baseline="middle">Picks a tool</text>
    <text class="edge-label" x="860" y="650" text-anchor="middle" dominant-baseline="middle">Reacts to result</text>
  </g>

  <g aria-label="Concept nodes">
    <rect class="node" x="70" y="304" width="270" height="130" rx="14" fill="#fbf6ec" stroke="#e5d7c3"/>
    <text class="node-label" x="205" y="369" text-anchor="middle" dominant-baseline="middle">Person</text>

    <rect class="node" x="505" y="304" width="270" height="130" rx="14" fill="#fff5ed" stroke="#d6a785"/>
    <text class="node-label" x="640" y="369" text-anchor="middle" dominant-baseline="middle">Model</text>

    <rect class="node" x="940" y="304" width="270" height="130" rx="14" fill="#eef6fa" stroke="#a9c4d3"/>
    <text class="node-label" x="1075" y="369" text-anchor="middle" dominant-baseline="middle">Tools</text>
  </g>
</svg>
