<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous Agent concept diagram</title>
  <desc id="desc">Diagram showing Person, Model, Tools, Schedule trigger, and Your Context feeding an autonomous agent flow.</desc>
  <defs>
    <style>
      :root {
        --porcelain: #fffdf8;
        --paper: #fbf6ec;
        --ink: #1f1713;
        --line: #e5d7c3;
        --sage: #6e8b6f;
        --plum: #7a4e68;
        --copper: #8f4e24;
        --model-fill: #fff5ed;
        --tools-fill: #eef6fa;
        --context-fill: #f0f6ee;
        --schedule-fill: #f7edf3;
      }

      text {
        fill: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        letter-spacing: 0;
      }

      .mono {
        font-family: "SF Mono", ui-monospace, "Fira Code", Menlo, Consolas, monospace;
        font-weight: 650;
      }

      .node-label {
        font-size: 48px;
        font-weight: 800;
      }

      .small-label {
        font-size: 34px;
      }

      .pill-label {
        font-size: 30px;
        font-weight: 780;
      }

      .context-title {
        font-size: 38px;
        font-weight: 800;
      }

      .card {
        stroke: var(--line);
        stroke-width: 2;
        filter: drop-shadow(0 8px 14px rgba(31, 23, 19, 0.10));
      }

      .flow,
      .flow-return {
        fill: none;
        stroke: var(--ink);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tool-loop {
        fill: none;
        stroke: var(--copper);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .context-feed {
        fill: none;
        stroke: var(--sage);
        stroke-width: 5;
        stroke-linecap: round;
      }

      .schedule-feed {
        fill: none;
        stroke: var(--plum);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1713"/>
    </marker>
    <marker id="arrow-copper" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f4e24"/>
    </marker>
    <marker id="arrow-sage" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8b6f"/>
    </marker>
    <marker id="arrow-plum" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a4e68"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#fffdf8"/>

  <g id="context">
    <rect x="410" y="56" width="760" height="170" rx="14" fill="#f0f6ee" stroke="#6e8b6f" stroke-opacity="0.78" stroke-width="3" filter="drop-shadow(0 10px 20px rgba(31, 23, 19, 0.10))"/>
    <text class="context-title" x="438" y="102">Your Context</text>
    <g class="context-pills">
      <rect x="438" y="128" width="158" height="64" rx="12" fill="#fffdf8" stroke="#e5d7c3" stroke-width="1"/>
      <text class="pill-label" x="517" y="169" text-anchor="middle">Profile</text>

      <rect x="612" y="128" width="158" height="64" rx="12" fill="#fffdf8" stroke="#e5d7c3" stroke-width="1"/>
      <text class="pill-label" x="691" y="169" text-anchor="middle">Memory</text>

      <rect x="786" y="128" width="158" height="64" rx="12" fill="#fffdf8" stroke="#e5d7c3" stroke-width="1"/>
      <text class="pill-label" x="865" y="169" text-anchor="middle">Data</text>

      <rect x="960" y="128" width="158" height="64" rx="12" fill="#fffdf8" stroke="#e5d7c3" stroke-width="1"/>
      <text class="pill-label" x="1039" y="169" text-anchor="middle">Workflows</text>
    </g>
  </g>

  <path class="context-feed" d="M 640 226 L 640 338" marker-end="url(#arrow-sage)"/>

  <g id="tool-loop">
    <path class="tool-loop" d="M 770 378 C 812 274 880 274 922 378" marker-end="url(#arrow-copper)"/>
    <text class="mono small-label" x="846" y="276" text-anchor="middle">Picks a tool</text>
    <path class="tool-loop" d="M 922 444 C 878 570 814 570 770 444" marker-end="url(#arrow-copper)"/>
    <text class="mono small-label" x="846" y="612" text-anchor="middle">Reacts to result</text>
  </g>

  <g id="conversation">
    <line class="flow" x1="325" y1="382" x2="506" y2="382" marker-end="url(#arrow-ink)"/>
    <text class="mono small-label" x="416" y="356" text-anchor="middle">Ask</text>
    <line class="flow-return" x1="506" y1="444" x2="325" y2="444" marker-end="url(#arrow-ink)"/>
    <text class="mono small-label" x="416" y="492" text-anchor="middle">Answers</text>
  </g>

  <g id="schedule-feed">
    <path class="schedule-feed" d="M 355 578 C 454 642 616 638 640 468" marker-end="url(#arrow-plum)"/>
  </g>

  <g id="nodes">
    <rect class="card" x="95" y="338" width="230" height="126" rx="14" fill="#fbf6ec"/>
    <text class="node-label" x="210" y="417" text-anchor="middle">Person</text>

    <rect class="card" x="506" y="338" width="268" height="130" rx="14" fill="#fff5ed" stroke="#d6a785"/>
    <text class="node-label" x="640" y="419" text-anchor="middle">Model</text>

    <rect class="card" x="922" y="338" width="236" height="130" rx="14" fill="#eef6fa" stroke="#a9c4d3"/>
    <text class="node-label" x="1040" y="419" text-anchor="middle">Tools</text>

    <rect class="card" x="95" y="540" width="260" height="76" rx="12" fill="#f7edf3" stroke="#7a4e68"/>
    <text class="small-label" x="225" y="590" text-anchor="middle" font-weight="800">Schedule</text>
  </g>
</svg>
